{{/*
  apollo-hub Service
  Exposes the hub coordinator on port 9191.
  Default type is ClusterIP; change to LoadBalancer to expose publicly.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "apollo.hub.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apollo.componentLabels" (dict "root" . "component" "hub") | nindent 4 }}
spec:
  type: {{ .Values.hub.service.type }}
  selector:
    {{- include "apollo.componentSelectorLabels" (dict "root" . "component" "hub") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.hub.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and .Values.hub.service.nodePort (or (eq .Values.hub.service.type "NodePort") (eq .Values.hub.service.type "LoadBalancer")) }}
      nodePort: {{ .Values.hub.service.nodePort }}
      {{- end }}
