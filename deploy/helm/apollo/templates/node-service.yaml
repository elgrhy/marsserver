{{/*
  apollo-node Services
  Two Services are created:
  1. A headless Service for StatefulSet DNS (pod-to-pod) — always ClusterIP None.
  2. A regular Service for client traffic — type from values (ClusterIP/NodePort/LoadBalancer).
*/}}
---
# Headless service for StatefulSet stable DNS entries
apiVersion: v1
kind: Service
metadata:
  name: {{ include "apollo.node.fullname" . }}-headless
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apollo.componentLabels" (dict "root" . "component" "node") | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "apollo.componentSelectorLabels" (dict "root" . "component" "node") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.node.service.port }}
      targetPort: http
      protocol: TCP
---
# Client-facing Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "apollo.node.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apollo.componentLabels" (dict "root" . "component" "node") | nindent 4 }}
  {{- if eq .Values.node.service.type "LoadBalancer" }}
  annotations:
    # Annotate for cloud load-balancers as needed, e.g.:
    # service.beta.kubernetes.io/aws-load-balancer-type: nlb
    {{- with .Values.node.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  type: {{ .Values.node.service.type }}
  selector:
    {{- include "apollo.componentSelectorLabels" (dict "root" . "component" "node") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.node.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and .Values.node.service.nodePort (or (eq .Values.node.service.type "NodePort") (eq .Values.node.service.type "LoadBalancer")) }}
      nodePort: {{ .Values.node.service.nodePort }}
      {{- end }}
  {{- if eq .Values.node.service.type "LoadBalancer" }}
  {{- with .Values.node.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
