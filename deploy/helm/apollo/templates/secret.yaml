{{/*
  Apollo Credentials Secret
  Holds node secret-keys, JWT signing secret, and hub internal key.
  Values that arrive via secretRef are NOT re-encoded here — those Secrets
  must already exist in the cluster and are referenced directly by the pods.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "apollo.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apollo.componentLabels" (dict "root" . "component" "credentials") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- /*
    node.secretKeys — only write if the user supplied a plain-text value.
    If they want an external secret they should configure node.secretKeysSecretRef.
  */}}
  {{- if .Values.node.secretKeys }}
  secret-keys: {{ .Values.node.secretKeys | b64enc | quote }}
  {{- else }}
  secret-keys: {{ "changeme-replace-before-use" | b64enc | quote }}
  {{- end }}

  {{- if .Values.node.jwtSecret }}
  jwt-secret: {{ .Values.node.jwtSecret | b64enc | quote }}
  {{- else }}
  jwt-secret: {{ "changeme-jwt-secret-replace" | b64enc | quote }}
  {{- end }}

  {{- if .Values.hub.hubKey }}
  hub-key: {{ .Values.hub.hubKey | b64enc | quote }}
  {{- else }}
  hub-key: {{ "changeme-hub-key-replace" | b64enc | quote }}
  {{- end }}
