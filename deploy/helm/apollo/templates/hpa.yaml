{{/*
  HorizontalPodAutoscaler for apollo-node
  Rendered only when autoscaling.enabled = true.

  NOTE: Because apollo-node is a StatefulSet with a PVC, horizontal scaling works
  best with ReadWriteMany storage (e.g. EFS/NFS) or when each pod uses its own
  PVC via the StatefulSet volumeClaimTemplate. Ensure your storage class supports
  the access mode you need before enabling HPA.
*/}}
{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "apollo.node.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apollo.componentLabels" (dict "root" . "component" "node") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: {{ include "apollo.node.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
{{- end }}
