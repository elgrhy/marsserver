{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "apollo.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apollo.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
---
{{/*
  ClusterRole — grants the operator RBAC to manage ApolloAgent CRDs and
  to read/update Deployments, Services, and Secrets it creates.
  Even when the operator is disabled we create the role so it is available
  as soon as it is enabled without a chart upgrade.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "apollo.fullname" . }}-operator
  labels:
    {{- include "apollo.componentLabels" (dict "root" . "component" "operator") | nindent 4 }}
rules:
  # Core CRD — ApolloAgent lifecycle
  - apiGroups: ["apollo.dev"]
    resources: ["apolloagents"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apollo.dev"]
    resources: ["apolloagents/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apollo.dev"]
    resources: ["apolloagents/finalizers"]
    verbs: ["update"]

  # Manage Deployments and StatefulSets for agent workloads
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Manage Services for agent network exposure
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Read Secrets to pass credentials to agents (never write sensitive data)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]

  # ConfigMaps for agent configuration
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Pod inspection for health-check reconciliation
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]

  # Events for audit trail
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

  # PersistentVolumeClaims for agent workspaces
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # HPA management (optional autoscaling)
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Leader election (for HA operator deployments)
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
{{- if .Values.serviceAccount.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "apollo.fullname" . }}-operator
  labels:
    {{- include "apollo.componentLabels" (dict "root" . "component" "operator") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "apollo.fullname" . }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ include "apollo.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
