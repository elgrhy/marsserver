# Apollo Node — Raw Kubernetes Manifests (no Helm)
#
# Before applying:
#   1. Create the namespace:    kubectl apply -f namespace.yaml
#   2. Create the credentials secret:
#      kubectl create secret generic apollo-credentials \
#        --namespace apollo \
#        --from-literal=secret-keys="your-key-here" \
#        --from-literal=jwt-secret="$(openssl rand -hex 32)"
#   3. Apply: kubectl apply -f node-deployment.yaml
#
# NOTE: For production workloads, replace the Deployment below with a
# StatefulSet + volumeClaimTemplate (see the Helm chart). A Deployment
# with a shared PVC is used here for simplicity in environments that
# support ReadWriteMany or where a single replica is sufficient.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: apollo-node
  namespace: apollo
  labels:
    app.kubernetes.io/name: apollo
    app.kubernetes.io/component: node
    app.kubernetes.io/version: "2.2.0"
---
# Persistent volume claim for .apollo/ state directory
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: apollo-node-data
  namespace: apollo
  labels:
    app.kubernetes.io/name: apollo
    app.kubernetes.io/component: node
    app.kubernetes.io/version: "2.2.0"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  # Remove storageClassName to use cluster default
  # storageClassName: standard
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: apollo-node
  namespace: apollo
  labels:
    app.kubernetes.io/name: apollo
    app.kubernetes.io/component: node
    app.kubernetes.io/version: "2.2.0"
spec:
  serviceName: apollo-node-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apollo
      app.kubernetes.io/component: node
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apollo
        app.kubernetes.io/component: node
        app.kubernetes.io/version: "2.2.0"
    spec:
      serviceAccountName: apollo-node
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: init-basedir
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "mkdir -p /apollo-data && chown -R 1000:1000 /apollo-data"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - name: apollo-data
              mountPath: /apollo-data
      containers:
        - name: apollo-node
          # Replace with your actual image
          image: ghcr.io/elgrhydev/apollo-node:2.2.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          command:
            - apollo
            - node
            - start
            - --base-dir
            - /home/apollo/.apollo
            - --listen
            - "0.0.0.0:8080"
            - --region
            - "us-east-1"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: APOLLO_SECRET_KEYS
              valueFrom:
                secretKeyRef:
                  name: apollo-credentials
                  key: secret-keys
            - name: APOLLO_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: apollo-credentials
                  key: jwt-secret
            - name: RUST_LOG
              value: "info"
            - name: RUST_BACKTRACE
              value: "1"
            - name: APOLLO_REGION
              value: "us-east-1"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          volumeMounts:
            - name: apollo-data
              mountPath: /home/apollo/.apollo
      volumes: []
  volumeClaimTemplates:
    - metadata:
        name: apollo-data
        labels:
          app.kubernetes.io/name: apollo
          app.kubernetes.io/component: node
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
---
# Headless Service for StatefulSet DNS
apiVersion: v1
kind: Service
metadata:
  name: apollo-node-headless
  namespace: apollo
  labels:
    app.kubernetes.io/name: apollo
    app.kubernetes.io/component: node
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: apollo
    app.kubernetes.io/component: node
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
# Client-facing Service
apiVersion: v1
kind: Service
metadata:
  name: apollo-node
  namespace: apollo
  labels:
    app.kubernetes.io/name: apollo
    app.kubernetes.io/component: node
    app.kubernetes.io/version: "2.2.0"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: apollo
    app.kubernetes.io/component: node
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
