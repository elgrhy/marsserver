[workspace]
members = [
    "crates/apollo-core",
    "crates/apollo-runtime",
    "crates/apollo-node",
    "crates/apollo-hub",
]
# apollo-operator uses kube/k8s-openapi and must be built standalone:
#   cd crates/apollo-operator && cargo build --release
exclude = ["crates/apollo-operator"]
resolver = "2"

[workspace.dependencies]
anyhow      = "1.0"
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
tokio       = { version = "1", features = ["full"] }
reqwest     = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "blocking", "stream"] }
dialoguer   = "0.11"
lazy_static = "1.4"
which       = "6.0"
sysinfo     = "0.30"
whoami      = "1.5"
sha2        = "0.10"
hmac        = "0.12"
hex         = "0.4"
tiny_http   = "0.12"
async-trait = "0.1"
flate2      = "1.0"
tar         = "0.4"
zip         = "0.6"
tempfile    = "3.10"
semver      = "1.0"
axum        = { version = "0.7", features = ["macros"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower       = { version = "0.4", features = ["full"] }
tower-http  = { version = "0.5", features = ["cors"] }
jsonwebtoken = "9"
uuid        = { version = "1", features = ["v4"] }
rand        = "0.8"
tracing              = "0.1"
tracing-subscriber   = { version = "0.3", features = ["env-filter"] }
shell-words          = "1.1"
aes-gcm              = "0.10"
hkdf                 = "0.12"
base64               = "0.22"
tokio-util           = { version = "0.7", features = ["rt"] }
futures              = "0.3"
tokio-stream         = { version = "0.1", features = ["sync"] }
